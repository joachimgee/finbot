# ============================================================================
# FinBot Nginx Configuration
# Reverse proxy, load balancing, rate limiting, security headers
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Optimize worker connections
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ========================================================================
    # Basic Settings
    # ========================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json escape=json '{'
                    '"time":"$time_iso8601",'
                    '"remote_addr":"$remote_addr",'
                    '"request_method":"$request_method",'
                    '"request_uri":"$request_uri",'
                    '"status":$status,'
                    '"body_bytes_sent":$body_bytes_sent,'
                    '"request_time":$request_time,'
                    '"upstream_response_time":"$upstream_response_time",'
                    '"user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer settings
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeout settings
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # ========================================================================
    # Gzip Compression
    # ========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        image/svg+xml;

    # ========================================================================
    # Rate Limiting Zones
    # ========================================================================
    # Standard API rate limit: 10 requests/second
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    
    # Backtest endpoint: 1 request/second (CPU intensive)
    limit_req_zone $binary_remote_addr zone=backtest_limit:10m rate=1r/s;
    
    # Walk-forward analysis: 1 request/5 seconds (very CPU intensive)
    limit_req_zone $binary_remote_addr zone=wfa_limit:10m rate=12r/m;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ========================================================================
    # Upstream Backend
    # ========================================================================
    upstream finbot_backend {
        least_conn;  # Load balancing method
        server app:8000 max_fails=3 fail_timeout=30s weight=1;
        keepalive 32;
    }

    # ========================================================================
    # HTTP Server
    # ========================================================================
    server {
        listen 80;
        server_name _;

        # Connection limit: max 10 concurrent connections per IP
        limit_conn conn_limit 10;

        # ====================================================================
        # Security Headers
        # ====================================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

        # ====================================================================
        # Health Check Endpoint (no rate limit, no logging)
        # ====================================================================
        location /health {
            access_log off;
            proxy_pass http://finbot_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ====================================================================
        # Metrics Endpoint (internal only)
        # ====================================================================
        location /metrics {
            allow 172.25.0.0/16;  # Internal network only
            deny all;
            access_log off;
            proxy_pass http://finbot_backend;
        }

        # ====================================================================
        # Walk-Forward Analysis Endpoints (very strict rate limit)
        # ====================================================================
        location ~ ^/api/v1/walk-forward {
            limit_req zone=wfa_limit burst=1 nodelay;
            limit_req_status 429;
            
            proxy_pass http://finbot_backend;
            include /etc/nginx/proxy_params;
            
            # Extended timeout for long-running analysis
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ====================================================================
        # Backtest Endpoints (strict rate limit)
        # ====================================================================
        location ~ ^/api/v1/backtest {
            limit_req zone=backtest_limit burst=2 nodelay;
            limit_req_status 429;
            
            proxy_pass http://finbot_backend;
            include /etc/nginx/proxy_params;
            
            # Extended timeout for backtesting
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ====================================================================
        # API Documentation (public)
        # ====================================================================
        location ~ ^/(docs|redoc|openapi.json) {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://finbot_backend;
            include /etc/nginx/proxy_params;
        }

        # ====================================================================
        # Standard API Endpoints
        # ====================================================================
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            
            proxy_pass http://finbot_backend;
            include /etc/nginx/proxy_params;
        }

        # ====================================================================
        # WebSocket Support (for live trading)
        # ====================================================================
        location /ws/ {
            proxy_pass http://finbot_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # ====================================================================
        # Root Location
        # ====================================================================
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://finbot_backend;
            include /etc/nginx/proxy_params;
        }

        # ====================================================================
        # Error Pages
        # ====================================================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # ====================================================================
        # Block Access to Hidden Files
        # ====================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ========================================================================
    # HTTPS Server (SSL/TLS)
    # Uncomment and configure when SSL certificates are available
    # ========================================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name finbot.ai www.finbot.ai;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # ... (same location blocks as HTTP server)
    # }
}
