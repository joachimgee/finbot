<!DOCTYPE html><html><head><meta charset='utf-8'><title>RL Tearsheet</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;margin:0;padding:24px;background:#fafafa;}
.container{max-width:1200px;margin:0 auto;background:white;padding:32px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
h1{margin-top:0;color:#1a1a1a;border-bottom:2px solid #0074d9;padding-bottom:12px;}
h2{color:#333;margin-top:32px;font-size:1.4em;}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin:20px 0;}
.card{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:20px;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.1);}
.card.positive{background:linear-gradient(135deg,#11998e 0%,#38ef7d 100%);}
.card.negative{background:linear-gradient(135deg,#eb3349 0%,#f45c43 100%);}
.card.neutral{background:linear-gradient(135deg,#4b6cb7 0%,#182848 100%);}
.card strong{display:block;font-size:0.85em;opacity:0.9;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;}
.card .value{font-size:1.8em;font-weight:bold;}
.chart-container{margin:24px 0;background:#f9f9f9;padding:20px;border-radius:8px;}
.chart{width:100%;height:250px;}
svg{display:block;}
.footer{margin-top:40px;padding-top:20px;border-top:1px solid #e0e0e0;color:#666;font-size:0.9em;text-align:center;}
</style></head><body>
<div class='container'>
<h1>📊 RL Performance Tearsheet</h1>
<p style='color:#666;margin-bottom:24px;'>Generated: 2025-11-24 14:20:00</p>
<h2>Key Metrics</h2>
<div class='metrics'>

<div class='card neutral'>
<strong>mean_reward</strong><div class='value'>0.0000</div>
</div>

<div class='card neutral'>
<strong>std_reward</strong><div class='value'>0.0000</div>
</div>

<div class='card neutral'>
<strong>mean_length</strong><div class='value'>1.0000</div>
</div>

<div class='card neutral'>
<strong>std_length</strong><div class='value'>0.0000</div>
</div>

</div>
<h2>Equity Curve</h2>
<div class='chart-container'>
<div class='chart'>
<svg viewBox='0 0 1000 250' preserveAspectRatio='none'>
  <defs><linearGradient id='grad' x1='0%' y1='0%' x2='0%' y2='100%'><stop offset='0%' style='stop-color:#0074d9;stop-opacity:0.3'/><stop offset='100%' style='stop-color:#0074d9;stop-opacity:0.05'/></linearGradient></defs>
  <polygon fill='url(#grad)' points='0,250 0.00,235.00 0.00,250'/>
  <polyline fill='none' stroke='#0074d9' stroke-width='2.5' points='0.00,235.00' />
</svg>
</div>
</div>

<div class='footer'>Generated by FinBot RL Pipeline | 2025-11-24 14:20:00</div>
</div>
</body></html>
