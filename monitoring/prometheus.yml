global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'finbot-monitor'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/alert-rules.yml'

scrape_configs:
  # FinBot Application Metrics
  - job_name: 'finbot-app'
    static_configs:
      - targets: ['app:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'python_gc_.*'
        action: drop

  # System Metrics (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'node_network_.*'
        action: drop

  # Docker Metrics (optional, requires cAdvisor or docker engine metrics)
  # - job_name: 'docker'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
