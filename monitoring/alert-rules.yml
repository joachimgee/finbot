groups:
  - name: finbot_alerts
    interval: 15s
    rules:
      # ------------------------------------------------------------------
      # Application Alerts
      # ------------------------------------------------------------------
      - alert: HighErrorRate
        # Error ratio > 5% over 5m
        expr: |
          (sum(rate(finbot_errors_total[5m]))
            /
           clamp_min(sum(rate(finbot_request_duration_seconds_count[5m])), 1)) > 0.05
        for: 5m
        labels:
          severity: critical
          service: finbot-app
        annotations:
          summary: 'High error rate detected on {{ $labels.instance }}'
          description: 'Error ratio > 5% (current: {{ $value | humanizePercentage }})'
          dashboard: 'http://localhost:3000/d/finbot-overview'

      - alert: HighResponseLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(finbot_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
          service: finbot-app
        annotations:
          summary: 'High API latency (p95) on {{ $labels.instance }}'
          description: 'p95 latency > 1s'

      - alert: HighResponseLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(finbot_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
          service: finbot-app
        annotations:
          summary: 'High API latency (p99)'
          description: 'p99 latency > 2s'

      - alert: BacktestFailure
        expr: increase(finbot_backtest_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: finbot-backtest
        annotations:
          summary: 'Backtest failures detected'
          description: '{{ $value }} backtest failures in last 5 minutes'

      - alert: WalkForwardAnalysisFailed
        expr: increase(finbot_wfa_failed_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
          service: finbot-wfa
        annotations:
          summary: 'Walk-forward analysis failures'
          description: 'WFA errors observed'

      - alert: TradingNoActivity
        expr: rate(finbot_trades_total[1h]) < 0.001
        for: 30m
        labels:
          severity: warning
          service: finbot-trading
        annotations:
          summary: 'Very low trading activity'
          description: 'Trade rate < 1 per hour (threshold: 0.001 t/s)'

      - alert: DrawdownTooHigh
        expr: abs(min_over_time(finbot_max_drawdown[15m])) > 0.2
        for: 10m
        labels:
          severity: warning
          service: finbot-trading
        annotations:
          summary: 'High drawdown'
          description: 'Max drawdown exceeds 20% over 15 minutes'

      # ------------------------------------------------------------------
      # System Alerts
      # ------------------------------------------------------------------
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: 'High memory usage on {{ $labels.instance }}'
          description: 'Memory usage {{ $value | humanizePercentage }}'

      - alert: HighCPUUsage
        expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: 'High CPU usage on {{ $labels.instance }}'
          description: 'CPU usage {{ $value | humanizePercentage }}'

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!="tmpfs"}
            / node_filesystem_size_bytes{fstype!="tmpfs"}) < 0.15
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: 'Low disk space on {{ $labels.instance }}'
          description: 'Only {{ $value | humanizePercentage }} available'

      - alert: HighDiskInodes
        expr: node_filesystem_files_free{fstype!="tmpfs"} / node_filesystem_files{fstype!="tmpfs"} < 0.10
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: 'Low free inodes'
          description: 'Free inodes < 10%'

      # ------------------------------------------------------------------
      # Dependencies (requires optional exporters)
      # NOTE: Uncomment if postgres_exporter and redis_exporter are deployed
      # ------------------------------------------------------------------
      # - alert: PostgresConnDown
      #   expr: pg_up == 0
      #   for: 1m
