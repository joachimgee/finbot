name: Daily Professional Analysis

on:
  schedule:
    # 09:35 America/New_York ≈ 14:35 UTC (standard) / 13:35 UTC (DST). Adjust as needed.
    - cron: '35 13 * * *'
  workflow_dispatch: {}

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Large universe can take hours

    env:
      APCA_API_BASE_URL: ${{ secrets.https://paper-api.alpaca.markets }}
      APCA_API_KEY_ID: ${{ secrets.PKAHIX63MNVTJPMD44ILTTJJ22 }}
      APCA_API_SECRET_KEY: ${{ secrets.3i2C3pAeCKa5YPL7NpSXgBx8mnwCu3uSWf2BwEurbT9P }}
      FMP_API_KEY: ${{ secrets.jJq5c4prWZALILljWhjgq08u2LV320lE }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.TGQCY9LANIUPJ4IL }}
      NEWSAPI_KEY: ${{ secrets.c264bd241a2447bb94c32ba44377eda1 }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (TA-Lib, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget curl libffi-dev libatlas-base-dev liblapack-dev gfortran
          python -m pip install --upgrade pip wheel setuptools

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Optional: install extra libs if not in requirements
          pip install financedatabase financetoolkit pypfopt riskfolio-lib alpaca-trade-api yfinance

      - name: Run professional full analysis (global)
        run: |
          echo "Starting professional global analysis at $(date -u)"
          python -u scripts/professional_analysis_daemon.py \
            --once \
            --limit 10000 \
            --top 150 \
            --regions "global" \
            --days 365 \
            --risk-level medium-high \
            --weighting ic-weighted \
            --output professional_analysis_daily.csv

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: professional-analysis-global
          path: professional_analysis_daily.csv
          retention-days: 14

      - name: Summary
        run: |
          echo "Run completed at $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Global professional analysis generated: professional_analysis_daily.csv" >> $GITHUB_STEP_SUMMARY
          echo "Top positions: 150 | Universe limit: 10000 | Weighting: IC-weighted" >> $GITHUB_STEP_SUMMARY
