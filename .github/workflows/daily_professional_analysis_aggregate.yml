name: Daily Professional Analysis Aggregation

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC after region jobs
  workflow_dispatch: {}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Download artifacts (regions)
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List downloaded artifacts
        run: |
          ls -R artifacts || true
      - name: Install deps
        run: |
          python -m pip install --upgrade pip wheel setuptools pandas
      - name: Aggregate regional results
        run: |
          cp artifacts/professional-analysis-us/professional_analysis_us.csv . 2>/dev/null || true
          cp artifacts/professional-analysis-eu/professional_analysis_eu.csv . 2>/dev/null || true
          cp artifacts/professional-analysis-asia/professional_analysis_asia.csv . 2>/dev/null || true
          cp artifacts/professional-analysis-americas/professional_analysis_americas.csv . 2>/dev/null || true
          cp artifacts/professional-analysis-full-30k/professional_analysis_full_30k.csv . 2>/dev/null || true
          python scripts/aggregate_professional_results.py --directory . --output professional_analysis_aggregated.csv
      - name: Upload aggregated artifact
        uses: actions/upload-artifact@v4
        with:
          name: professional-analysis-aggregated
          path: professional_analysis_aggregated.csv
          retention-days: 30
      - name: Summary
        run: |
          echo "Aggregated global ranking generated: professional_analysis_aggregated.csv" >> $GITHUB_STEP_SUMMARY
