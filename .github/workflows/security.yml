# Security Scan Workflow
name: Security Scan

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday
  workflow_dispatch:

jobs:
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tooling
        run: |
          # bandit/safety n'ont pas besoin des dépendances du projet installées
          # (bandit scanne les sources, safety lit requirements.txt) — inutile
          # de tirer torch/transformers ici.
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit (Python security)
        run: |
          # Le package vit sous src/ (layout src) — l'ancien chemin ne scannait rien.
          bandit -r src/financial_analyzer/ -f json -o bandit-report.json || true

      - name: Check dependencies (Safety)
        run: |
          safety check -r requirements.txt --json > safety-report.json || true

      - name: Check for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF results
        # Non bloquant : l'upload vers l'onglet Security exige le code scanning
        # activé (indispo sur un repo privé sans GitHub Advanced Security).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
