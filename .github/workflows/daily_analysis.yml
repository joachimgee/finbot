name: Daily Analysis

# Analyse quotidienne "professional" + exécution des ordres sur le compte
# Alpaca PAPER (le daemon force mode='paper'). Remplace l'ancienne famille de
# workflows daily_professional_analysis_* (doublons, secrets mal câblés,
# double exécution DST/Standard, package jamais installé).

on:
  schedule:
    # 13:35 UTC en semaine ≈ ouverture du marché US (09:35 ET en heure d'été,
    # 08:35 ET en heure d'hiver). Un seul cron : pas de double exécution.
    - cron: '35 13 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre de symboles à analyser"
        required: false
        default: '12000'
      regions:
        description: "Régions (global, us, eu, asia, americas)"
        required: false
        default: 'global'

# Empêche deux analyses de tourner en même temps (dispatch manuel + cron).
concurrency:
  group: daily-analysis
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 h max

    env:
      # Mapping secrets -> variables lues par financial_analyzer.config / l'adapter
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      # Défaut paper si le secret n'est pas défini : garde-fou contre le live
      APCA_API_BASE_URL: ${{ secrets.APCA_API_BASE_URL || 'https://paper-api.alpaca.markets' }}
      FINANCIAL_MODELING_PREP_API_KEY: ${{ secrets.FMP_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWSAPI_KEY }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # torch CPU-only d'abord (évite de tirer les wheels CUDA)
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt
          # Installe le package (layout src/) pour que `import financial_analyzer`
          # fonctionne : le daemon en dépend et n'ajoute que la racine au sys.path.
          pip install --no-cache-dir -e . --no-deps

      - name: Run daily analysis daemon (paper)
        run: |
          python -u scripts/professional_analysis_daemon.py \
            --once \
            --limit "${{ github.event.inputs.limit || '12000' }}" \
            --regions "${{ github.event.inputs.regions || 'global' }}" \
            --top 200 \
            --days 365 \
            --risk-level medium-high \
            --weighting ic-weighted \
            --output daily_master_result.csv

      - name: Results summary
        if: always()
        run: |
          if [ -f daily_master_result.csv ]; then
            echo "✅ Run terminé — $(( $(wc -l < daily_master_result.csv) - 1 )) lignes d'ordres"
            echo "=== TOP 10 (poids) ==="
            head -11 daily_master_result.csv | column -t -s,
          else
            echo "❌ Échec — aucun CSV généré"
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-analysis-${{ github.run_number }}
          path: |
            daily_master_result.csv
            daily_master_summary.json
            logs/*.log
          retention-days: 30
          if-no-files-found: warn
