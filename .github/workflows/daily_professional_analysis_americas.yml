name: Daily Professional Analysis AMERICAS

on:
  schedule:
    - cron: '15 2 * * *'  # 02:15 UTC
  workflow_dispatch: {}

jobs:
  americas-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      APCA_API_BASE_URL: ${{ secrets.https://paper-api.alpaca.markets }}
      APCA_API_KEY_ID: ${{ secrets.PKAHIX63MNVTJPMD44ILTTJJ22 }}
      APCA_API_SECRET_KEY: ${{ secrets.3i2C3pAeCKa5YPL7NpSXgBx8mnwCu3uSWf2BwEurbT9P }}
      FMP_API_KEY: ${{ secrets.jJq5c4prWZALILljWhjgq08u2LV320lE }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.TGQCY9LANIUPJ4IL }}
      NEWSAPI_KEY: ${{ secrets.c264bd241a2447bb94c32ba44377eda1 }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libatlas-base-dev liblapack-dev gfortran
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt || true
          pip install financedatabase financetoolkit pypfopt riskfolio-lib alpaca-trade-api yfinance
      - name: Run AMERICAS analysis
        run: |
          python -u scripts/professional_analysis_daemon.py --once \
            --limit 9000 \
            --top 160 \
            --regions americas \
            --days 365 \
            --risk-level medium-high \
            --weighting ic-weighted \
            --output professional_analysis_americas.csv
      - name: Upload AMERICAS artifact
        uses: actions/upload-artifact@v4
        with:
            name: professional-analysis-americas
            path: professional_analysis_americas.csv
            retention-days: 14
      - name: Summary
        run: |
          echo "AMERICAS analysis done" >> $GITHUB_STEP_SUMMARY
          echo "Symbols limit: 9000 | Top: 160" >> $GITHUB_STEP_SUMMARY
