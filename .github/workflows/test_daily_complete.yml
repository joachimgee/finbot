name: Test Daily Complete Analysis

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of symbols to test'
        required: false
        default: '50'

permissions:
  contents: read
  actions: read

jobs:
  test-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          cat > .env << EOF
          APCA_API_KEY_ID=${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY=${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL=${{ secrets.APCA_API_BASE_URL }}
          FINANCIAL_MODELING_PREP_API_KEY=${{ secrets.FMP_API_KEY }}
          ALPHA_VANTAGE_API_KEY=${{ secrets.ALPHAVANTAGE_API_KEY }}
          NEWS_API_KEY=${{ secrets.NEWSAPI_KEY }}
          EOF

      - name: Test Complete Analysis (Small Scale)
        run: |
          echo "🧪 Testing complete analysis with ${{ github.event.inputs.limit }} symbols"
          python -u scripts/professional_analysis_daemon.py \
            --once \
            --limit ${{ github.event.inputs.limit }} \
            --regions us \
            --top 20 \
            --days 90 \
            --risk-level medium \
            --weighting ic-weighted \
            --output test_complete_analysis.csv

      - name: Validate Results
        run: |
          if [ -f test_complete_analysis.csv ]; then
            echo "✅ Analysis completed successfully"
            echo "📊 Results:"
            wc -l test_complete_analysis.csv
            head -5 test_complete_analysis.csv
          else
            echo "❌ Analysis failed - no output file"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            test_complete_analysis.csv
            logs/*.log
          retention-days: 7
