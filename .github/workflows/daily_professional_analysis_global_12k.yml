name: Daily Professional Analysis Global 12K

on:
  schedule:
    # 09:30 ET (DST) = 13:30 UTC | 09:30 ET (Standard) = 14:30 UTC
    - cron: '30 13 * * 1-5'  # US market open - DST
    - cron: '30 14 * * 1-5'  # US market open - Standard Time
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 heures max
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create .env file
        run: |
          cat > .env << EOF
          APCA_API_KEY_ID=${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY=${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL=${{ secrets.APCA_API_BASE_URL }}
          FINANCIAL_MODELING_PREP_API_KEY=${{ secrets.FMP_API_KEY }}
          ALPHA_VANTAGE_API_KEY=${{ secrets.ALPHAVANTAGE_API_KEY }}
          NEWS_API_KEY=${{ secrets.NEWSAPI_KEY }}
          EOF
          
      - name: Run Daily Master Orchestrated Analysis (12K Global)
        run: |
          python -u scripts/daily_master_run.py \
            --limit 12000 \
            --regions global \
            --output daily_master_result_global_12k.csv
          
      - name: Display results summary
        if: always()
        run: |
          if [ -f daily_master_result_global_12k.csv ]; then
            echo "✅ Daily master run completed successfully"
            echo "Total order rows: $(wc -l < daily_master_result_global_12k.csv)"
            echo ""
            echo "=== TOP 10 TARGETS (weights) ==="
            head -11 daily_master_result_global_12k.csv | column -t -s,
            echo ""
            echo "=== PORTFOLIO STATUS ==="
            python -c "from src.financial_analyzer.trading.alpaca_adapter import AlpacaAdapter; adapter=AlpacaAdapter.from_env(mode='paper'); adapter.connect(); account=adapter.get_account(); positions=adapter.get_positions(); print(f'Equity: \${float(account.get("equity",0)):,.2f}'); print(f'Positions: {len(positions)}'); print(f'Cash: \${float(account.get("cash",0)):,.2f}')"
          else
            echo "❌ Analysis failed - no CSV generated"
            exit 1
          fi
          
      - name: Upload analysis results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily-master-global-12k-${{ github.run_number }}
          path: |
            daily_master_result_global_12k.csv
            daily_master_summary.json
            logs/*.log
          retention-days: 30
          
      - name: Create results badge
        if: success()
        run: |
          ORDER_ROWS=$(wc -l < daily_master_result_global_12k.csv)
          echo "Daily master run generated $ORDER_ROWS order rows (GLOBAL) on $(date -u +"%Y-%m-%d %H:%M UTC")" > analysis_status.txt
          
      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-status-${{ github.run_number }}
          path: analysis_status.txt
          retention-days: 7
