name: Daily Professional Analysis US

on:
  schedule:
    - cron: '30 13 * * *'  # 09:30 AM ET (US market open) during DST (EDT = UTC-4)
    - cron: '30 14 * * *'  # 09:30 AM ET (US market open) during Standard Time (EST = UTC-5)
  workflow_dispatch: {}

jobs:
  us-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      APCA_API_BASE_URL: ${{ secrets.https://paper-api.alpaca.markets }}
      APCA_API_KEY_ID: ${{ secrets.PKAHIX63MNVTJPMD44ILTTJJ22 }}
      APCA_API_SECRET_KEY: ${{ secrets.3i2C3pAeCKa5YPL7NpSXgBx8mnwCu3uSWf2BwEurbT9P }}
      FMP_API_KEY: ${{ secrets.jJq5c4prWZALILljWhjgq08u2LV320lE }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.TGQCY9LANIUPJ4IL }}
      NEWSAPI_KEY: ${{ secrets.c264bd241a2447bb94c32ba44377eda1 }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libatlas-base-dev liblapack-dev gfortran
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt || true
          pip install financedatabase financetoolkit pypfopt riskfolio-lib alpaca-trade-api yfinance
      - name: Run US analysis
        run: |
          python -u scripts/professional_analysis_daemon.py --once \
            --limit 12000 \
            --top 200 \
            --regions us \
            --days 365 \
            --risk-level medium-high \
            --weighting ic-weighted \
            --output professional_analysis_us.csv
      - name: Upload US artifact
        uses: actions/upload-artifact@v4
        with:
            name: professional-analysis-us
            path: professional_analysis_us.csv
            retention-days: 14
      - name: Summary
        run: |
          echo "US analysis done" >> $GITHUB_STEP_SUMMARY
          echo "Symbols limit: 12000 | Top: 200" >> $GITHUB_STEP_SUMMARY
