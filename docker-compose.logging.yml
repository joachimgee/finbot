version: '3.9'

# ELK Logging Stack for FinBot
# Services: Elasticsearch (9200), Logstash (5000), Kibana (5601)
# Features:
# - Centralized logging from all services
# - Log indexing by day (finbot-YYYY.MM.DD)
# - 30-day retention with hot/warm tiering
# - JSON structured logging

services:
  # ----------------------------------------------------------------------
  # ELASTICSEARCH - Search & Storage Engine
  # ----------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: finbot-elasticsearch
    hostname: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - '9200:9200'
      - '9300:9300'
    networks:
      - finbot-network
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ----------------------------------------------------------------------
  # LOGSTASH - Log Aggregation & Transformation
  # ----------------------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.0
    container_name: finbot-logstash
    hostname: logstash
    restart: unless-stopped
    volumes:
      - ./logging/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logging/logstash/patterns:/usr/share/logstash/patterns:ro
    environment:
      - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
    ports:
      - '5000:5000'
      - '9600:9600'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9600 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - finbot-network
    command: logstash -f /usr/share/logstash/pipeline/logstash.conf
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '2'

  # ----------------------------------------------------------------------
  # KIBANA - Visualization & Exploration
  # ----------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    container_name: finbot-kibana
    hostname: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - '5601:5601'
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - finbot-network
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:5601/api/status || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'

volumes:
  elasticsearch-data:
    driver: local

networks:
  finbot-network:
    driver: bridge
