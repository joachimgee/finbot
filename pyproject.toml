[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finbot"
version = "2.0.0"
description = "Quantitative trading platform integrating best-of-breed open-source tools"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FinBot Team", email = "team@finbot.io" }]
keywords = [
    "finance",
    "trading",
    "quantitative",
    "backtesting",
    "portfolio-optimization",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/joachimgee/finbot"
"Bug Tracker" = "https://github.com/joachimgee/finbot/issues"
Documentation = "https://github.com/joachimgee/finbot/blob/main/docs/"
"Source Code" = "https://github.com/joachimgee/finbot"

[project.optional-dependencies]
dev = [
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
]

[project.scripts]
finbot = "financial_analyzer.cli.analysis_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "data: marks tests as data layer tests (universe, market data, fundamentals)",
    "features: marks tests as feature engineering tests (technical, fundamental)",
    "backtest: marks tests as backtesting tests",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
