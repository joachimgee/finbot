input {
  tcp {
    port => 5000
    # Use json_lines to handle newline-delimited JSON records
    codec => json_lines
    type => "json"
    host => "0.0.0.0"
  }
}

filter {
  # Input already parsed by codec => json_lines, no need to re-parse message

  # Field Extraction (root-level fields)
  mutate {
    add_field => {
      "environment" => "production"
      "version" => "1.0.0"
    }
    
    # Extract key fields
    add_field => {
      "service" => "%{[service]}"
      "level" => "%{[level]}"
      "request_id" => "%{[request_id]}"
      "user_id" => "%{[user_id]}"
    }
  }

  # Timestamp Parsing
  if [timestamp] {
    date {
      match => ["[timestamp]", "ISO8601", "UNIX"]
      target => "@timestamp"
      timezone => "UTC"
    }
  }

  # Severity Mapping
  mutate {
    replace => {
      "severity" => "info"
    }
  }

  if [level] =~ /^ERROR|CRITICAL$/ {
    mutate {
      replace => { "severity" => "error" }
    }
  } else if [level] == "WARNING" {
    mutate {
      replace => { "severity" => "warning" }
    }
  }

  # Stack Trace Handling
  if [traceback] {
    mutate {
      add_field => {
        "has_error" => true
        "error_type" => "%{[error_type]}"
      }
    }
  }

  # Optional: Grok patterns on message if present for non-JSON sources
  if [message] and ![service] {
    grok {
      patterns_dir => ["/usr/share/logstash/patterns"]
      match => {
        "message" => [
          "%{API_METHOD:http_method} %{API_RESPONSE:http_status} %{API_DURATION:duration}ms",
          "%{TRADE_ACTION:trade_action} %{TRADE_SYMBOL:symbol} %{TRADE_PRICE:price}"
        ]
      }
      tag_on_failure => ["grok_parse_failure"]
    }
  }

  # Remove verbose fields
  mutate {
    remove_field => ["message", "host", "type"]
  }
}

output {
  # Elasticsearch with daily index
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "finbot-%{+YYYY.MM.dd}"
  }

  # Console debug for errors
  if [severity] == "error" {
    stdout {
      codec => rubydebug
    }
  }
}
